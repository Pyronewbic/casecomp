<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Casecomp Admin — API Keys</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="admin.css">
</head>
<body>
  <header>
    <div class="logo">API Key Management</div>
    <div class="auth-bar">
      <input type="password" id="owner-key" placeholder="Owner key (CC_LIVE_...)" autocomplete="off">
      <button id="auth-btn">Authenticate</button>
      <button id="logout-btn" class="danger hidden">Logout</button>
    </div>
  </header>

  <main id="main" class="hidden">
    <div id="stats" class="stats-grid"></div>

    <div class="quick-links">
      <a href="/api/health" target="_blank">Health</a>
      <a href="/docs" target="_blank">API Docs</a>
    </div>

    <div class="tab-bar">
      <button class="tab active" data-tab="keys">Keys</button>
      <button class="tab" data-tab="analytics">Analytics</button>
      <button class="tab" data-tab="errors">Errors</button>
      <button class="tab" data-tab="funnel">Funnel</button>
    </div>

    <div id="tab-keys" class="tab-content">
      <div class="toolbar">
        <h2>Developer Keys</h2>
        <button id="create-btn">+ Create Key</button>
      </div>

      <div id="create-form" class="hidden card">
        <input type="text" id="new-label" placeholder="Label (e.g. Lovable frontend)">
        <input type="number" id="new-rate" placeholder="Rate limit (req/min)" value="60">
        <button id="submit-create">Create</button>
      </div>

      <div id="key-list"></div>
    </div>

    <div id="tab-analytics" class="tab-content hidden">
      <div class="toolbar">
        <h2>Analytics</h2>
        <select id="analytics-days" onchange="loadAnalytics()">
          <option value="7">7 days</option>
          <option value="14">14 days</option>
          <option value="30">30 days</option>
        </select>
      </div>
      <div id="analytics-stats" class="stats-grid"></div>
      <div class="toolbar"><h3>Daily Volume</h3></div>
      <div id="analytics-daily" class="card"></div>
      <div class="analytics-columns">
        <div>
          <div class="toolbar"><h3>By Tier</h3></div>
          <div id="analytics-tier" class="card"></div>
        </div>
        <div>
          <div class="toolbar"><h3>By Status</h3></div>
          <div id="analytics-status" class="card"></div>
        </div>
      </div>
      <div class="toolbar"><h3>Top Paths</h3></div>
      <div id="analytics-paths" class="card"></div>
      <div class="toolbar"><h3>Top Queries</h3></div>
      <div id="analytics-queries" class="card"></div>
    </div>

    <div id="tab-errors" class="tab-content hidden">
      <div class="toolbar">
        <h2>Recent Errors</h2>
        <div class="toolbar-right">
          <select id="error-type-filter" onchange="loadErrors()">
            <option value="">All types</option>
            <option value="search">search</option>
            <option value="sold">sold</option>
            <option value="psa">psa</option>
            <option value="grade">grade</option>
            <option value="api">api</option>
            <option value="unhandled">unhandled</option>
            <option value="unhandledRejection">unhandledRejection</option>
            <option value="uncaughtException">uncaughtException</option>
          </select>
          <button class="secondary" onclick="loadErrors()">Refresh</button>
        </div>
      </div>
      <div id="error-list"></div>
    </div>

    <div id="tab-funnel" class="tab-content hidden">
      <div class="toolbar">
        <h2>User Funnel</h2>
        <button class="secondary" onclick="loadFunnel()">Refresh</button>
      </div>
      <div id="funnel-chart"></div>
    </div>

    <div id="status" class="hidden"></div>
  </main>

  <script src="admin.js"></script>
</body>
</html>
