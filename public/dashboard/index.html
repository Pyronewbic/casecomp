<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Casecomp Dashboard — Pokemon TCG Card Research</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="dashboard.css">
  <link rel="icon" href="/logos/casecomp-logo.svg" type="image/svg+xml">
</head>
<body>
  <header>
    <div class="header-left">
      <a href="/dashboard" class="logo">Casecomp</a>
      <nav>
        <a href="/dashboard" class="nav-link active" data-page="search">Search</a>
        <a href="#" class="nav-link" data-page="history">Price History</a>
      </nav>
    </div>
    <div class="header-right">
      <span id="key-display" class="key-display hidden"></span>
      <button id="logout-btn" class="btn-secondary hidden">Logout</button>
    </div>
  </header>

  <div id="auth-screen" class="auth-screen">
    <div class="auth-card">
      <h1>Casecomp Dashboard</h1>
      <p>Pokemon TCG card research — prices, AI grading, PSA signals</p>
      <input type="password" id="api-key-input" placeholder="API key (CC_LIVE_...)" autocomplete="off">
      <button id="auth-btn" class="btn-gold">Sign In</button>
      <button id="demo-btn" class="btn-secondary">Try sample data without key</button>
    </div>
  </div>

  <main id="main" class="hidden">
    <div id="page-search">
      <section class="search-section">
        <form id="search-form" autocomplete="off">
          <div class="search-bar">
            <input type="text" id="search-input" placeholder="Search any Pokemon card...">
            <button type="submit" id="search-btn">Search</button>
          </div>
        </form>
        <div class="search-hints">
          <button type="button" class="hint" data-q="Pikachu ex SAR 234/193 PSA 10" data-demo="true">Pikachu ex SAR PSA 10</button>
          <button type="button" class="hint" data-q="Mega Greninja ex SAR" data-source="snkrdunk" data-condition="A" data-demo="true">Mega Greninja ex SAR</button>
          <button type="button" class="hint" data-q="Umbreon ex SAR 217/187" data-demo="true">Umbreon ex SAR 217/187</button>
        </div>
      </section>

      <section id="results" class="results hidden">
        <div id="results-header" class="results-header"></div>
        <div id="psa-signal" class="psa-signal hidden"></div>
        <div class="results-layout">
          <div class="results-left">
            <div class="list-tabs">
              <button class="list-tab active" data-tab="active">Active</button>
              <button class="list-tab" data-tab="sold">Sold</button>
            </div>
            <div id="source-filters-slot"></div>
            <div id="active-list" class="card-list"></div>
            <div id="sold-list" class="card-list hidden"></div>
          </div>
          <div class="results-right">
            <div id="detail-panel" class="detail-panel">
              <div class="detail-empty">Click a listing to inspect</div>
            </div>
          </div>
        </div>
      </section>
    </div>

    <div id="page-history" class="hidden">
      <section class="search-section">
        <form id="history-form" autocomplete="off">
          <div class="search-bar">
            <input type="text" id="history-input" placeholder="Card name for price history...">
            <button type="submit">View History</button>
          </div>
        </form>
      </section>
      <div id="history-chart-container" class="hidden">
        <div class="chart-card">
          <h2 id="history-title"></h2>
          <canvas id="history-chart" height="250"></canvas>
          <div id="history-stats" class="price-chart-stats"></div>
        </div>
        <div id="history-table"></div>
      </div>
    </div>
  </main>

  <script src="dashboard.js"></script>
</body>
</html>
