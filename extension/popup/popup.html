<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header class="header">
    <div class="header-top">
      <div class="header-left">
        <div class="header-eyebrow">
          <span class="dot"></span>
          <span id="eyebrow-status">Live · 0 targets</span>
        </div>
        <h1>Case<span class="accent">comp</span></h1>
      </div>
      <label class="toggle">
        <input type="checkbox" id="enabled">
        <span class="slider"></span>
      </label>
    </div>
    <div class="header-meta">
      <div class="stat">
        <span class="stat-num holo" id="stat-best-pos">—</span>
        <span class="stat-lbl">Best Pos</span>
      </div>
      <div class="stat">
        <span class="stat-num" id="stat-next-eta">—</span>
        <span class="stat-lbl">Next ETA</span>
      </div>
      <div class="stat">
        <span class="stat-num" id="stat-today">0</span>
        <span class="stat-lbl">Today</span>
      </div>
      <div class="stat">
        <span class="stat-num" id="stat-armed">0</span>
        <span class="stat-lbl">Targets</span>
      </div>
    </div>
  </header>

  <div class="section">
    <div class="section-head">
      <h2>Targets</h2>
      <span class="rule"></span>
      <span class="meta" id="targets-meta">0 active</span>
    </div>
    <div class="add-row">
      <input type="text" id="url-input" placeholder="Paste product URL...">
      <button id="url-add">+</button>
    </div>
    <div id="target-list"></div>
  </div>

  <div class="section">
    <div class="section-head">
      <h2>Recent Activity</h2>
      <span class="rule"></span>
      <button class="meta-btn" id="log-clear">CLEAR</button>
    </div>
    <div class="log" id="log"></div>
  </div>

  <footer class="footer">
    <button class="btn" id="open-settings">⚙</button>
    <div class="spacer"></div>
    <button class="btn primary" id="open-dashboard">Dashboard</button>
  </footer>

  <div class="settings-drawer" id="settings-drawer">
    <div class="section">
      <div class="section-head">
        <h2>Options</h2>
        <span class="rule"></span>
        <button class="meta-btn" id="close-settings">✕</button>
      </div>
      <div class="option-list">
        <label class="option"><input type="checkbox" id="auto-join"><span class="opt-box"></span>Auto-join queues</label>
        <label class="option"><input type="checkbox" id="auto-atc"><span class="opt-box"></span>Auto add-to-cart</label>
        <label class="option"><input type="checkbox" id="sound-alerts"><span class="opt-box"></span>Sound alerts</label>
        <label class="option"><input type="checkbox" id="notifications"><span class="opt-box"></span>Notifications</label>
      </div>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
