<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Costco — Product</title>
  <style>
    body { font-family: Arial, sans-serif; background: #fff; color: #333; margin: 0; padding: 40px; }
    .product-info-container { max-width: 600px; margin: 0 auto; }
    h1 { font-size: 22px; margin-bottom: 8px; }
    .price { font-size: 20px; font-weight: 700; color: #005DAA; margin-bottom: 16px; }
    .desc { color: #666; font-size: 14px; line-height: 1.6; margin-bottom: 24px; }
    .img-placeholder {
      width: 300px; height: 300px; background: #f5f5f5; border-radius: 8px;
      display: flex; align-items: center; justify-content: center; color: #ccc;
      font-size: 14px; margin-bottom: 24px;
    }
    #add-to-cart-btn {
      background: #005DAA; color: #fff; border: none; border-radius: 4px;
      padding: 12px 36px; font-size: 16px; cursor: pointer;
    }
    #add-to-cart-btn:hover { background: #004080; }
    .success { display: none; background: #4caf50; color: #fff; padding: 12px 20px; border-radius: 6px; margin-top: 16px; font-size: 14px; }
  </style>
</head>
<body>
  <div class="product-info-container">
    <div class="img-placeholder">[Product Image]</div>
    <h1>Pokemon TCG Bundle — Costco Exclusive</h1>
    <div class="price">$89.99</div>
    <p class="desc">Costco exclusive bundle featuring 20 booster packs across multiple Pokemon TCG sets, plus 2 promo cards.</p>
    <button id="add-to-cart-btn">Add to Cart</button>
    <div class="success" id="success-msg">Added to cart!</div>
  </div>

  <script>
    document.getElementById("add-to-cart-btn").addEventListener("click", () => {
      document.getElementById("add-to-cart-btn").disabled = true;
      document.getElementById("add-to-cart-btn").textContent = "Added!";
      document.getElementById("success-msg").style.display = "block";
    });
  </script>
</body>
</html>
