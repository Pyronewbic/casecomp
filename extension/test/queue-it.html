<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Queue-it — Waiting Room</title>
  <style>
    body { font-family: sans-serif; background: #1a1a2e; color: #fff; margin: 0; padding: 0; }
    .container { max-width: 500px; margin: 60px auto; text-align: center; padding: 40px; }
    h1 { font-size: 20px; margin-bottom: 12px; }
    p { color: #aaa; font-size: 14px; margin-bottom: 16px; }
    #MainPart_lbWhichIs498 { font-size: 28px; font-weight: 700; color: #7c5cfc; display: block; margin: 16px 0; }
    .progress-bar {
      height: 8px; background: #333; border-radius: 4px; overflow: hidden; margin: 16px 0;
    }
    .progress-bar .fill {
      height: 100%; background: #7c5cfc; width: 5%; transition: width 1s; border-radius: 4px;
    }
    button {
      background: #7c5cfc; color: #fff; border: none; border-radius: 6px;
      padding: 12px 32px; font-size: 15px; cursor: pointer; margin-top: 12px;
    }
    button:hover { background: #6a4ae0; }
    .phase { display: none; }
    .phase.active { display: block; }
    .status { font-size: 12px; color: #555; margin-top: 12px; }
  </style>
</head>
<body>
  <div class="container">
    <div class="phase active" id="join-phase">
      <h1>Welcome to the waiting room</h1>
      <p>You will be redirected to the site when it's your turn.</p>
      <button id="join-btn">Join Queue</button>
    </div>

    <div class="phase" id="wait-phase">
      <h1>You're in the queue</h1>
      <p>Your estimated position:</p>
      <span id="MainPart_lbWhichIs498">2,031 of 8,000</span>
      <div class="progress-bar"><div class="fill" id="bar"></div></div>
      <p class="status" id="status">Please keep this tab open</p>
    </div>
  </div>

  <script>
    const joinPhase = document.getElementById("join-phase");
    const waitPhase = document.getElementById("wait-phase");
    const posEl = document.getElementById("MainPart_lbWhichIs498");
    const bar = document.getElementById("bar");
    const status = document.getElementById("status");

    let pos = 2031;
    const total = 8000;

    document.getElementById("join-btn").addEventListener("click", () => {
      joinPhase.classList.remove("active");
      waitPhase.classList.add("active");

      const timer = setInterval(() => {
        pos = Math.max(0, pos - Math.floor(Math.random() * 600 + 300));
        const pct = Math.min(100, ((total - pos) / total) * 100);
        posEl.textContent = pos > 0 ? `${pos.toLocaleString()} of ${total.toLocaleString()}` : "You're next!";
        bar.style.width = pct + "%";
        if (pos <= 0) {
          clearInterval(timer);
          status.textContent = "Redirecting to site...";
          setTimeout(() => { window.location.href = "/pokemon-center/through"; }, 1500);
        }
      }, 2000);
    });
  </script>
</body>
</html>
