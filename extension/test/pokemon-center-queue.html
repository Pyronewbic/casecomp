<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Pokemon Center</title>
  <style>
    body { font-family: sans-serif; background: #1a1a2e; color: #fff; margin: 0; }
    .page-bg { padding: 40px; text-align: center; opacity: 0.3; }
    .page-bg h1 { font-size: 28px; }
    .queue-overlay {
      position: fixed; inset: 0; background: rgba(0,0,0,0.85);
      display: flex; align-items: center; justify-content: center; z-index: 9999;
    }
    .queue-box {
      background: #222; border-radius: 12px; padding: 32px 48px; text-align: center; max-width: 420px;
    }
    .queue-box h2 { font-size: 20px; margin-bottom: 8px; }
    .queue-box p { color: #aaa; font-size: 14px; margin-bottom: 16px; }
    .position { font-size: 32px; font-weight: 700; color: #7c5cfc; margin: 12px 0; }
    .ttw { font-size: 18px; color: #aaa; margin: 8px 0; }
    .bar { height: 6px; background: #333; border-radius: 3px; margin: 12px 0; overflow: hidden; }
    .bar-fill { height: 100%; background: #7c5cfc; width: 10%; transition: width 1s; border-radius: 3px; }
    .status-label { font-size: 12px; color: #666; margin-top: 8px; }
  </style>
</head>
<body>
  <div class="page-bg">
    <h1>Pokemon Center</h1>
    <p>Charizard UPC — Product Page (behind queue)</p>
  </div>

  <!-- Simulates the Incapsula waiting room iframe -->
  <iframe id="incapsula-iframe" src="/_Incapsula_Resource" style="display:none;"></iframe>

  <div class="queue-overlay" id="overlay">
    <div class="queue-box">
      <h2>You're in the waiting room</h2>
      <p>Please keep this tab open. You'll be redirected automatically.</p>
      <div class="position" id="position">Position: 1,247</div>
      <div class="ttw"><span id="ttw">00:02:30</span> estimated wait</div>
      <div class="bar"><div class="bar-fill" id="bar-fill"></div></div>
      <p class="status-label" id="status">Do not close this tab</p>
    </div>
  </div>

  <script>
    let pos = 1247;
    let secs = 150;
    const position = document.getElementById("position");
    const ttwEl = document.getElementById("ttw");
    const barFill = document.getElementById("bar-fill");
    const status = document.getElementById("status");

    const timer = setInterval(() => {
      pos = Math.max(0, pos - Math.floor(Math.random() * 400 + 200));
      secs = Math.max(0, Math.floor((pos / 1247) * 150));
      const pct = Math.min(100, ((1247 - pos) / 1247) * 100);

      const mm = String(Math.floor(secs / 60)).padStart(2, "0");
      const ss = String(secs % 60).padStart(2, "0");
      ttwEl.textContent = `00:${mm}:${ss}`;
      position.textContent = pos > 0 ? `Position: ${pos.toLocaleString()}` : "You're next!";
      barFill.style.width = pct + "%";

      if (pos <= 0) {
        clearInterval(timer);
        status.textContent = "Redirecting to product page...";
        document.getElementById("incapsula-iframe")?.remove();
        setTimeout(() => { window.location.href = "/pokemon-center/through"; }, 1500);
      }
    }, 2000);
  </script>
</body>
</html>
