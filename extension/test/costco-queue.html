<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Costco — Please Wait</title>
  <style>
    body { font-family: Arial, sans-serif; background: #fff; color: #333; margin: 0; }
    .queue-container {
      max-width: 500px; margin: 80px auto; text-align: center; padding: 40px;
      border: 1px solid #ddd; border-radius: 8px;
    }
    h1 { font-size: 22px; margin-bottom: 8px; color: #005DAA; }
    p { color: #666; font-size: 14px; margin-bottom: 20px; }
    .wait-info { font-size: 16px; font-weight: 600; color: #005DAA; margin-bottom: 20px; }
    .spinner {
      width: 40px; height: 40px; border: 4px solid #eee; border-top-color: #005DAA;
      border-radius: 50%; animation: spin 1s linear infinite; margin: 0 auto 20px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .status { font-size: 12px; color: #999; margin-top: 16px; }
  </style>
</head>
<body>
  <!-- Simulates Incapsula iframe (same as Pokemon Center) -->
  <iframe id="incapsula-iframe" src="/_Incapsula_Resource" style="display:none;"></iframe>

  <div class="queue-container">
    <div class="spinner"></div>
    <h1>Virtual Waiting Room</h1>
    <p>Due to high demand for this item, you are in a virtual waiting room. You will be randomly placed and redirected when it's your turn.</p>
    <div class="wait-info">
      <div>Estimated wait: <span id="ttw">00:01:30</span></div>
    </div>
    <p class="status" id="status">Please do not refresh this page</p>
  </div>

  <script>
    let secs = 8;
    const ttwEl = document.getElementById("ttw");
    const statusEl = document.getElementById("status");

    const timer = setInterval(() => {
      secs--;
      if (secs > 0) {
        const mm = String(Math.floor(secs / 60)).padStart(2, "0");
        const ss = String(secs % 60).padStart(2, "0");
        ttwEl.textContent = `00:${mm}:${ss}`;
      } else {
        clearInterval(timer);
        ttwEl.textContent = "00:00:00";
        statusEl.textContent = "Redirecting...";
        document.getElementById("incapsula-iframe")?.remove();
        setTimeout(() => { window.location.href = "/costco/through"; }, 1000);
      }
    }, 1000);
  </script>
</body>
</html>
