name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]

jobs:
  lint-and-validate:
    name: Lint & Validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Validate manifest.json
        run: node -e "const m = JSON.parse(require('fs').readFileSync('extension/manifest.json','utf8')); if (m.manifest_version !== 3) throw 'bad manifest version'; console.log('manifest OK:', m.name, 'v' + m.version)"

      - name: Validate extension JS syntax
        run: |
          for f in extension/background.js extension/popup/popup.js extension/dashboard/dashboard.js extension/content/sites/discord.js extension/content/sites/pokemon-center-listings.js extension/content/queue-monitor.js; do
            node --check "$f" && echo "✓ $f" || exit 1
          done

      - name: Validate CLI entry points
        run: |
          node --check index.js
          node --check scan.js
          node --check psa-report.js

  snkrdunk-scrape:
    name: SNKRDUNK scrape + condition filter
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Scrape SNKRDUNK with --condition A
        run: node index.js --source snkrdunk --no-ebay --condition A --results 3 --output ci-test "Mega Greninja ex SAR"

      - name: Verify output JSON exists and has listings
        run: |
          test -f output/ci-test.json || (echo "output/ci-test.json missing" && exit 1)
          node -e "
            const d = JSON.parse(require('fs').readFileSync('output/ci-test.json','utf8'));
            const items = d.results[0].activeByCountry.US;
            if (!items.length) throw 'no listings found';
            console.log('Listings:', items.length);
            const hasImages = items.some(i => i.additionalImages && i.additionalImages.length > 0);
            console.log('Has additional images:', hasImages);
            items.forEach((item, i) => {
              const imgCount = 1 + (item.additionalImages || []).length;
              console.log('#' + (i+1), '$' + item.price, imgCount + ' images', item.condition);
            });
          "

      - name: Verify condition A filter
        run: |
          node -e "
            const d = JSON.parse(require('fs').readFileSync('output/ci-test.json','utf8'));
            const items = d.results[0].activeByCountry.US;
            const allA = items.every(i => i.condition && i.condition.startsWith('A'));
            if (!allA) throw 'condition filter failed — non-A listings found';
            console.log('All', items.length, 'listings are condition A ✓');
          "

  extension-structure:
    name: Extension structure & dashboard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify all extension files exist
        run: |
          files=(
            extension/manifest.json
            extension/background.js
            extension/popup/popup.html
            extension/popup/popup.js
            extension/popup/popup.css
            extension/dashboard/dashboard.html
            extension/dashboard/dashboard.js
            extension/dashboard/dashboard.css
            extension/content/queue-monitor.js
            extension/content/sites/discord.js
            extension/content/sites/pokemon-center.js
            extension/content/sites/pokemon-center-jp.js
            extension/content/sites/pokemon-center-listings.js
            extension/content/sites/walmart.js
            extension/content/sites/walmart-inject.js
            extension/content/sites/costco.js
          )
          for f in "${files[@]}"; do
            test -f "$f" && echo "✓ $f" || (echo "✗ $f missing" && exit 1)
          done

      - name: Verify manifest references valid files
        run: |
          node -e "
            const m = JSON.parse(require('fs').readFileSync('extension/manifest.json','utf8'));
            const fs = require('fs');
            const files = new Set();
            for (const cs of m.content_scripts) {
              for (const js of cs.js) files.add('extension/' + js);
            }
            files.add('extension/' + m.background.service_worker);
            for (const f of files) {
              if (!fs.existsSync(f)) throw 'manifest references missing file: ' + f;
              console.log('✓', f);
            }
            console.log('All manifest JS references valid');
          "

      - name: Verify no hardcoded Discord defaults in source
        run: |
          if grep -r 'discordChannels: \["pokemon-center"\]' extension/; then
            echo "FAIL: hardcoded Discord channel found"
            exit 1
          fi
          if grep -r 'DROP_KEYWORDS_DEFAULT = \[' extension/ | grep -v '= \[\];'; then
            echo "FAIL: hardcoded keywords found"
            exit 1
          fi
          echo "✓ No hardcoded Discord config in source"

      - name: Verify popup has Monitor/Settings tabs
        run: |
          grep -q 'data-tab="main"' extension/popup/popup.html && echo "✓ Monitor tab" || exit 1
          grep -q 'data-tab="settings"' extension/popup/popup.html && echo "✓ Settings tab" || exit 1

      - name: Verify dashboard has Workers/News tabs
        run: |
          grep -q 'data-tab="workers"' extension/dashboard/dashboard.html && echo "✓ Workers tab" || exit 1
          grep -q 'data-tab="news"' extension/dashboard/dashboard.html && echo "✓ News tab" || exit 1
